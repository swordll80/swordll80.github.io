<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手册速查</title>
  <style>
    :root {
      --bg:#f5f6fa; --card:#fff; --accent:#356ae6; --muted:#7d8599;
      --line:#e2e5ee; --text:#1a1a2e; --radius:12px;
      --tree-w:280px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg); color:var(--text); line-height:1.7;
      min-height:100vh; display:flex; flex-direction:column;
    }

    /* topbar */
    .topbar {
      position:sticky; top:0; z-index:10; background:var(--card);
      border-bottom:1px solid var(--line); padding:10px 18px;
      display:flex; align-items:center; gap:12px;
      box-shadow:0 1px 6px rgba(0,0,0,.04); min-height:48px;
    }
    .topbar .brand { font-size:18px; font-weight:700; color:var(--accent); text-decoration:none; white-space:nowrap; }
    .topbar .home-btn { display:inline-flex; align-items:center; gap:4px; font-family:inherit; font-size:13px; text-decoration:none; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:5px 10px; background:var(--card); white-space:nowrap; cursor:pointer; }
    .topbar .home-btn:hover { border-color:var(--accent); color:var(--accent); }
    .topbar .tree-search { flex:1; min-width:120px; max-width:340px; position:relative; }
    .topbar .tree-search input { width:100%; height:34px; padding:0 30px 0 12px; border:1px solid var(--line); border-radius:20px; font-size:13px; background:var(--bg); outline:none; font-family:inherit; color:var(--text); }
    .topbar .tree-search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(53,106,230,.12); }
    .topbar .ts-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--muted); cursor:pointer; font-size:13px; display:none; padding:2px; line-height:1; }
    .topbar .desc { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:1; min-width:0; max-width:240px; }
    @media (max-width:1000px){ .topbar .desc { display:none; } }
    .topbar .menu-btn {
      display:none; width:32px; height:32px; border:1px solid var(--line);
      border-radius:8px; background:var(--card); cursor:pointer; flex-shrink:0;
      align-items:center; justify-content:center; font-size:18px; color:var(--text);
    }

    /* main layout */
    .main { display:flex; flex:1; min-height:0; }
    .tree-panel {
      width:var(--tree-w); flex-shrink:0; border-right:1px solid var(--line);
      background:var(--card); overflow-y:auto; overflow-x:hidden;
      padding:12px 0; transition:transform .25s;
    }
    .view-panel { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg); }
    .view-panel iframe {
      flex:1; border:0; width:100%; min-height:0;
    }
    /* PDF 打开条与手机端回退 */
    .pdf-bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .pdf-open { display:inline-flex; align-items:center; gap:5px; background:var(--accent); color:#fff; border-radius:9px; padding:8px 14px; font-size:13px; text-decoration:none; white-space:nowrap; }
    .pdf-open:hover { opacity:.92; }
    .pdf-name { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pdf-fallback { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:30px 22px; text-align:center; color:var(--muted); }
    .pdf-fallback p { max-width:440px; font-size:14px; line-height:1.8; }
    .pdf-open.big { font-size:16px; padding:13px 30px; }
    .view-placeholder {
      flex:1; display:flex; align-items:center; justify-content:center;
      color:var(--muted); font-size:15px; user-select:none;
    }

    /* tree */
    .tree-node { user-select:none; }
    .tree-row {
      display:flex; align-items:center; gap:6px; padding:6px 16px;
      cursor:pointer; transition:background .12s; font-size:14px;
      text-decoration:none; color:inherit;
    }
    .tree-row:hover { background:#f0f3fa; }
    .tree-row.active { background:#e8ecf9; color:var(--accent); font-weight:600; }
    .tree-row .arrow {
      width:18px; height:18px; display:flex; align-items:center; justify-content:center;
      font-size:10px; color:var(--muted); flex-shrink:0; transition:transform .2s;
    }
    .tree-row .arrow.open { transform:rotate(90deg); }
    .tree-row .icon {
      width:22px; height:22px; border-radius:6px; display:flex; align-items:center;
      justify-content:center; font-size:13px; flex-shrink:0;
    }
    .tree-row .icon.folder { background:#e8ecf9; color:var(--accent); }
    .tree-row .icon.file { background:#f0f2f5; color:var(--muted); font-size:11px; }
    .tree-row .icon.pdf { background:#fdeaea; color:#b42318; font-size:9px; font-weight:800; }
    .tree-row .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tree-row .label mark { background:#fde047; color:#101828; border-radius:2px; padding:0 1px; }
    .tree-children { overflow:hidden; transition:max-height .3s; }
    .tree-children.collapsed { max-height:0; }
    .tree-children .tree-row { padding-left:38px; }

    /* mobile overlay */
    .tree-overlay {
      display:none; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.35);
    }
    .tree-overlay.show { display:block; }

    @media (max-width:768px) {
      .topbar .menu-btn { display:flex; }
      .tree-panel {
        position:fixed; top:48px; left:0; bottom:0; z-index:25;
        transform:translateX(-100%); box-shadow:4px 0 20px rgba(0,0,0,.12);
        max-width:300px;
      }
      .tree-panel.open { transform:translateX(0); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="目录" title="目录">&#9776;</button>
    <a class="brand" href="read.html">手册速查</a>
    <div class="tree-search">
      <input id="treeSearch" type="search" placeholder="模糊检索文件/PDF…" autocomplete="off">
      <button class="ts-clear" id="tsClear" type="button" title="清除">&#10005;</button>
    </div>
    <span class="desc" id="currentTitle">选择一个文件开始</span>
    <button type="button" class="home-btn" id="refreshBtn" title="重新加载最新目录 list.txt">&#8635; 刷新目录</button>
    <a class="home-btn" id="homeBtn" href="index.html" title="返回主页">&#8962; 返回主页</a>
  </div>
  <div class="main">
    <div class="tree-overlay" id="treeOverlay"></div>
    <aside class="tree-panel" id="treePanel"></aside>
    <section class="view-panel" id="viewPanel">
      <div class="view-placeholder" id="placeholder">&#8592; 从左侧目录选择文件</div>
    </section>
  </div>

  <script>
  /* 给主页/本页链接追加版本号，点击时刷新，确保获取最新页面。 */
  (function() {
    function withV(h){ return h + (h.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now(); }
    function stamp(el){ if(!el) return; var base = el.getAttribute('href'); el.addEventListener('click', function(){ el.setAttribute('href', withV(base)); }); }
    stamp(document.getElementById('homeBtn'));
    stamp(document.querySelector('.topbar .brand'));
  })();
  </script>
  <script>
  (function() {
    var treePanel = document.getElementById('treePanel');
    var viewPanel = document.getElementById('viewPanel');
    var placeholder = document.getElementById('placeholder');
    var currentTitle = document.getElementById('currentTitle');
    var menuBtn = document.getElementById('menuBtn');
    var treeOverlay = document.getElementById('treeOverlay');
    var activeRow = null;
    // 手机/触屏设备：内嵌 iframe 打开 PDF 无法翻页，改为新标签打开
    var IS_MOBILE = /Android|iPhone|iPod|iPad|Mobile|Silk/i.test(navigator.userAgent) || (('ontouchstart' in window) && Math.min(window.innerWidth, window.innerHeight) <= 820);

    // mobile menu
    function openTree() { treePanel.classList.add('open'); treeOverlay.classList.add('show'); }
    function closeTree() { treePanel.classList.remove('open'); treeOverlay.classList.remove('show'); }
    menuBtn.addEventListener('click', function() {
      treePanel.classList.contains('open') ? closeTree() : openTree();
    });
    treeOverlay.addEventListener('click', closeTree);

    // ---- 顶部模糊检索：过滤目录树（空格分词，需全部命中；匹配处高亮，自动展开匹配分类） ----
    var treeSearch = document.getElementById('treeSearch');
    var tsClear = document.getElementById('tsClear');

    function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function hlLabel(label, terms){
      var base = label.getAttribute('data-t');
      if (base === null) { base = label.textContent; label.setAttribute('data-t', base); }
      if (!terms.length){ label.textContent = base; return; }
      var low = base.toLowerCase(), ranges = [];
      terms.forEach(function(t){ var i = low.indexOf(t), from = 0; while (i >= 0){ ranges.push([i, i + t.length]); from = i + t.length; i = low.indexOf(t, from); } });
      if (!ranges.length){ label.textContent = base; return; }
      ranges.sort(function(a,b){ return a[0]-b[0]; });
      var merged = [], last = null;
      ranges.forEach(function(r){ if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else { last = r.slice(); merged.push(last); } });
      var html = '', pos = 0;
      merged.forEach(function(r){ html += escHtml(base.slice(pos, r[0])) + '<mark>' + escHtml(base.slice(r[0], r[1])) + '</mark>'; pos = r[1]; });
      html += escHtml(base.slice(pos));
      label.innerHTML = html;
    }
    function filterTree(q){
      q = (q || '').trim();
      tsClear.style.display = q ? 'block' : 'none';
      var terms = q ? q.toLowerCase().split(/\s+/).filter(Boolean) : [];
      var folderNodes = treePanel.querySelectorAll(':scope > .tree-node');
      folderNodes.forEach(function(fn){
        var frow = fn.querySelector(':scope > .tree-row');
        var flabel = frow.querySelector('.label');
        var fname = flabel.getAttribute('data-t'); if (fname === null){ fname = flabel.textContent; flabel.setAttribute('data-t', fname); }
        var fnameLow = fname.toLowerCase();
        var childrenDiv = fn.querySelector(':scope > .tree-children');
        var fileNodes = childrenDiv ? childrenDiv.querySelectorAll(':scope > .tree-node') : [];
        var folderMatch = terms.length && terms.every(function(t){ return fnameLow.indexOf(t) >= 0; });
        var anyVisible = false;
        fileNodes.forEach(function(cn){
          var clabel = cn.querySelector('.label');
          var ctitle = clabel.getAttribute('data-t'); if (ctitle === null){ ctitle = clabel.textContent; clabel.setAttribute('data-t', ctitle); }
          var hay = fnameLow + '/' + ctitle.toLowerCase();
          var ok = !terms.length || folderMatch || terms.every(function(t){ return hay.indexOf(t) >= 0; });
          cn.style.display = ok ? '' : 'none';
          hlLabel(clabel, ok ? terms : []);
          if (ok) anyVisible = true;
        });
        hlLabel(flabel, folderMatch ? terms : []);
        fn.style.display = (!terms.length || anyVisible) ? '' : 'none';
        var arrow = frow.querySelector('.arrow');
        if (childrenDiv) childrenDiv.classList.remove('collapsed'); arrow.classList.add('open');
      });
    }
    var tsTimer = 0;
    if (treeSearch){
      treeSearch.addEventListener('input', function(){ clearTimeout(tsTimer); tsTimer = setTimeout(function(){ filterTree(treeSearch.value); }, 120); });
    }
    if (tsClear){
      tsClear.addEventListener('click', function(){ treeSearch.value = ''; filterTree(''); treeSearch.focus(); });
    }

    function showLoadError(msg) {
      treePanel.innerHTML = '<div style="padding:24px 16px;color:#c0392b;font-size:14px;line-height:1.8">' +
        '<strong>\u26A0 \u76EE\u5F55\u52A0\u8F7D\u5931\u8D25</strong><br><small>' +
        msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
        '</small></div>';
      console.error(msg);
    }

    // Load list.txt and build tree\uFF08\u5E26\u7248\u672C\u53F7 + no-store\uFF0C\u7ED5\u8FC7\u6D4F\u89C8\u5668\u4E0E CDN \u7F13\u5B58\uFF0C\u786E\u4FDD\u62FF\u5230\u6700\u65B0 list.txt\uFF09
    function loadTree() {
      treePanel.innerHTML = '<div class="tree-loading" style="padding:20px 16px;color:#7d8599;font-size:13px">\u6B63\u5728\u52A0\u8F7D\u76EE\u5F55...</div>';
      fetch('notes/list.txt?v=' + Date.now(), { cache: 'no-store' })
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function(text) {
          var tree = buildTreeFromList(text);
          if (tree.length === 0) {
            showLoadError('list.txt \u4E2D\u6CA1\u6709\u6587\u4EF6\u3002');
            return;
          }
          treePanel.innerHTML = '';
          activeRow = null;
          renderTree(tree, treePanel);
          if (treeSearch && treeSearch.value.trim()) filterTree(treeSearch.value);
        })
        .catch(function(err) {
          showLoadError('\u65E0\u6CD5\u52A0\u8F7D notes/list.txt\uFF1A' + err.message);
        });
    }

    // Convert flat list into tree: {title, children: [{title, file}]}
    function buildTreeFromList(text) {
      var lines = text.split(/\r?\n/);
      var folders = {};
      lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        // line: "folder/sub/file.html" or "folder/file.html"
        var parts = line.split('/');
        var folderName = parts[0];
        var fileName = parts.slice(1).join('/');
        var title = fileName.replace(/\.(html?|pdf)$/i, '');
        var isPdf = /\.pdf$/i.test(fileName);
        if (!folders[folderName]) {
          folders[folderName] = [];
        }
        folders[folderName].push({ title: title, file: 'notes/' + line, pdf: isPdf });
      });

      var tree = [];
      Object.keys(folders).sort().forEach(function(folderName) {
        var files = folders[folderName];
        // Sort files by title (natural order)
        files.sort(function(a, b) {
          return a.title.localeCompare(b.title, 'zh-CN', { numeric: true });
        });
        tree.push({
          title: folderName,
          children: files
        });
      });
      return tree;
    }

    loadTree();

    var refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function() {
        loadTree();
        currentTitle.textContent = '目录已刷新';
        setTimeout(function() { if (currentTitle.textContent === '目录已刷新') currentTitle.textContent = '选择一个文件开始'; }, 1500);
      });
    }

    function renderTree(nodes, parent) {
      nodes.forEach(function(node) {
        var wrapper = document.createElement('div');
        wrapper.className = 'tree-node';

        var row = document.createElement('div');
        row.className = 'tree-row';

        var hasChildren = node.children && node.children.length > 0;
        var hasFile = !!node.file;

        var arrow = document.createElement('span');
        arrow.className = 'arrow';
        if (hasChildren) {
          arrow.textContent = '\u25B6';
          arrow.classList.add('open');   /* \u9ED8\u8BA4\u5C55\u5F00\u76EE\u5F55 */
        }
        row.appendChild(arrow);

        var icon = document.createElement('span');
        icon.className = 'icon ' + (hasChildren ? 'folder' : (node.pdf ? 'pdf' : 'file'));
        icon.textContent = hasChildren ? '\uD83D\uDCC1' : (node.pdf ? 'PDF' : '\uD83D\uDCC4');
        row.appendChild(icon);

        var label = document.createElement('span');
        label.className = 'label';
        label.textContent = node.title;
        row.appendChild(label);

        var childrenDiv = document.createElement('div');
        childrenDiv.className = 'tree-children';
        if (hasChildren) {
          renderTree(node.children, childrenDiv);   /* 默认展开，不加 collapsed */
        }

        if (hasChildren) {
          arrow.addEventListener('click', function(e) {
            e.stopPropagation();
            var open = !childrenDiv.classList.contains('collapsed');
            if (open) {
              childrenDiv.classList.add('collapsed');
              arrow.classList.remove('open');
            } else {
              childrenDiv.classList.remove('collapsed');
              arrow.classList.add('open');
            }
          });
        }

        row.addEventListener('click', function(e) {
          e.stopPropagation();
          if (hasFile) {
            openFile(node.file, node.title);
            if (activeRow) activeRow.classList.remove('active');
            row.classList.add('active');
            activeRow = row;
            closeTree();
          } else if (hasChildren) {
            var open = !childrenDiv.classList.contains('collapsed');
            if (open) {
              childrenDiv.classList.add('collapsed');
              arrow.classList.remove('open');
            } else {
              childrenDiv.classList.remove('collapsed');
              arrow.classList.add('open');
            }
          }
        });

        wrapper.appendChild(row);
        wrapper.appendChild(childrenDiv);
        parent.appendChild(wrapper);
      });
    }

    function openFile(file, title) {
      // \u6E05\u9664\u65E7\u5185\u5BB9
      ['iframe', '.pdf-bar', '.pdf-fallback'].forEach(function(sel){ var el = viewPanel.querySelector(sel); if (el) el.remove(); });
      placeholder.style.display = 'none';
      currentTitle.textContent = title;
      document.title = title + ' \u2014 \u624B\u518C\u901F\u67E5';

      if (/\.pdf$/i.test(file)) {
        var bar = document.createElement('div'); bar.className = 'pdf-bar';
        var a = document.createElement('a'); a.className = 'pdf-open'; a.href = file; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = '\u2197 \u5728\u65B0\u6807\u7B7E\u6253\u5F00 / \u4E0B\u8F7D PDF';
        var nm = document.createElement('span'); nm.className = 'pdf-name'; nm.textContent = title;
        bar.appendChild(a); bar.appendChild(nm);
        viewPanel.appendChild(bar);
        if (IS_MOBILE) {
          var fb = document.createElement('div'); fb.className = 'pdf-fallback';
          var p1 = document.createElement('p'); p1.innerHTML = '\u624B\u673A\u6D4F\u89C8\u5668<b>\u5185\u5D4C PDF \u901A\u5E38\u65E0\u6CD5\u7FFB\u9875/\u6EDA\u52A8</b>\uFF08\u53EA\u663E\u793A\u7B2C\u4E00\u9875\uFF09\u3002';
          var p2 = document.createElement('p'); p2.textContent = '\u8BF7\u70B9\u51FB\u4E0B\u65B9\u6309\u94AE\uFF0C\u7528\u624B\u673A\u81EA\u5E26\u9605\u8BFB\u5668\u6253\u5F00\uFF0C\u53EF\u6B63\u5E38\u7FFB\u9875\u3001\u7F29\u653E\u3002';
          var big = document.createElement('a'); big.className = 'pdf-open big'; big.href = file; big.target = '_blank'; big.rel = 'noopener noreferrer'; big.textContent = '\u6253\u5F00 PDF';
          fb.appendChild(p1); fb.appendChild(p2); fb.appendChild(big);
          viewPanel.appendChild(fb);
        } else {
          var pf = document.createElement('iframe'); pf.src = file; pf.title = title; viewPanel.appendChild(pf);
        }
      } else {
        var ifr = document.createElement('iframe');
        ifr.src = file + (file.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
        ifr.title = title;
        viewPanel.appendChild(ifr);
      }
    }
  })();
  </script>
</body>
</html>
