<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机器人开发</title>
  <style>
    :root { --bg:#f5f6fa; --card:#fff; --accent:#356ae6; --muted:#7d8599; --line:#e2e5ee; --text:#1a1a2e; --radius:12px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.7; min-height:100vh; }
    .topbar { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:10px; }
    .topbar h1 { font-size:17px; white-space:nowrap; background:linear-gradient(135deg,#356ae6,#5a4de0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .search-wrap { flex:1; position:relative; max-width:400px; }
    .search-wrap input { width:100%; height:36px; padding:0 36px 0 14px; border:1px solid var(--line); border-radius:20px; font-size:14px; background:var(--bg); outline:none; transition:border-color .2s,box-shadow .2s; }
    .search-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(53,106,230,.12); }
    .search-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%; border:0; background:transparent; font-size:16px; color:var(--muted); cursor:pointer; display:none; align-items:center; justify-content:center; }
    .search-clear.visible { display:flex; }
    .search-clear:hover { background:var(--line); color:var(--text); }
    .result-count { font-size:13px; color:var(--muted); white-space:nowrap; }
    .container { max-width:900px; margin:0 auto; padding:14px; }
    .intro { background:var(--card); border-radius:var(--radius); box-shadow:0 2px 12px rgba(0,0,0,.04); padding:14px 16px; margin-bottom:14px; font-size:13.5px; color:var(--muted); }
    .section { margin-bottom:14px; border-radius:var(--radius); background:var(--card); box-shadow:0 2px 12px rgba(0,0,0,.04); overflow:hidden; }
    .section-head { display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; transition:background .15s; border:0; width:100%; text-align:left; font:inherit; color:inherit; background:none; }
    .section-head:hover { background:#f8f9fd; }
    .section-head .icon { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; background:linear-gradient(135deg,#356ae6,#5a4de0); color:#fff; font-weight:700; }
    .section-head .title { flex:1; font-size:15px; font-weight:700; }
    .section-head .count { font-size:12px; color:var(--muted); background:var(--bg); padding:2px 10px; border-radius:10px; }
    .section-head .arrow { font-size:12px; color:var(--muted); transition:transform .25s; }
    .section.open .section-head .arrow { transform:rotate(180deg); }
    .section-body { display:none; border-top:1px solid var(--line); }
    .section.open .section-body { display:block; }
    .card { padding:12px 16px; border-bottom:1px solid var(--line); transition:background .15s; }
    .card:last-child { border-bottom:0; }
    .card.hidden { display:none; }
    .card-head { display:flex; align-items:flex-start; gap:10px; margin-bottom:5px; }
    .card-num { font-size:11px; color:var(--muted); font-weight:700; min-width:26px; text-align:right; padding-top:2px; }
    .card-title { flex:1; font-weight:700; font-size:14px; }
    .card-ver { font-size:10px; color:var(--accent); background:rgba(53,106,230,.08); padding:1px 7px; border-radius:5px; white-space:nowrap; }
    .card-code { margin-top:6px; background:#f8f9fc; border:1px solid var(--line); border-radius:8px; padding:10px 13px; font-family:"Cascadia Code","Fira Code","Consolas","Courier New",monospace; font-size:12.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; overflow-x:auto; color:#2d3436; }
    .card-title mark, .card-code mark { background:#fef08a; color:inherit; border-radius:2px; padding:0 1px; }
    .card-fig { margin-top:8px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; overflow-x:auto; }
    .card-fig svg { max-width:100%; height:auto; display:block; margin:0 auto; }
    .card-fig .cap { text-align:center; font-size:11px; color:var(--muted); margin-top:4px; }
    .back-top { position:fixed; bottom:20px; right:20px; width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; border:0; font-size:18px; cursor:pointer; box-shadow:0 4px 16px rgba(53,106,230,.35); display:none; align-items:center; justify-content:center; z-index:10; transition:transform .2s; }
    .back-top.visible { display:flex; }
    .back-top:active { transform:scale(.92); }
    .no-result { text-align:center; padding:40px 20px; color:var(--muted); font-size:15px; }
    @media (max-width:600px) {
      .topbar { padding:8px 10px; gap:6px; flex-wrap:wrap; }
      .topbar h1 { font-size:15px; }
      .search-wrap { max-width:none; flex:1 1 160px; }
      .search-wrap input { height:32px; font-size:13px; }
      .result-count { font-size:11px; }
      .container { padding:8px; }
      .section { margin-bottom:10px; border-radius:10px; }
      .section-head { padding:10px 12px; }
      .section-head .icon { width:28px; height:28px; font-size:14px; border-radius:7px; }
      .section-head .title { font-size:13px; }
      .card { padding:10px 12px; }
      .card-title { font-size:13px; }
      .card-code { padding:8px 10px; font-size:12px; border-radius:6px; }
      .back-top { bottom:14px; right:14px; width:36px; height:36px; font-size:16px; }
    }
  </style>
</head>
<body>
<div class="topbar">
  <h1>机器人开发</h1>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="搜索知识点...">
    <button class="search-clear" id="searchClear" title="清除">✕</button>
  </div>
  <span class="result-count" id="resultCount">4 条</span>
</div>
<div class="container" id="cardContainer">
    <div class="intro">感知-决策-控制与 ROS,理解机器人开发方向。</div>
    <div class="section open" id="sect-1">
      <button class="section-head">
        <span class="icon">1</span>
        <span class="title">一、体系</span>
        <span class="count">2 条</span>
        <span class="arrow">▼</span>
      </button>
      <div class="section-body">
        <div class="card" id="card-1-1" data-keywords="感知-决策-控制 传感(激光/相机/IMU/编码器)→感知(定位建图 SLAM)→规划(路径/运动)→控制(电机/舵机)。 机器人:感知-决策-控制">
          <div class="card-head">
            <span class="card-num">1</span>
            <span class="card-title">感知-决策-控制</span>
          </div>
          <div class="card-code">传感(激光/相机/IMU/编码器)→感知(定位建图 SLAM)→规划(路径/运动)→控制(电机/舵机)。</div>
          <div class="card-fig"><svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="9"><defs><marker id="rb" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#356ae6"/></marker></defs><rect x="6" y="24" width="66" height="26" rx="3" fill="#eef3ff" stroke="#356ae6"/><text x="14" y="41">感知</text><rect x="90" y="24" width="66" height="26" rx="3" fill="#e8f7ee" stroke="#356ae6"/><text x="98" y="41">决策/规划</text><rect x="184" y="24" width="66" height="26" rx="3" fill="#fff4e6" stroke="#356ae6"/><text x="192" y="41">控制</text><rect x="268" y="24" width="66" height="26" rx="3" fill="#f3f0ff" stroke="#356ae6"/><text x="276" y="41">执行</text><line x1="72" y1="37" x2="82" y2="37" stroke="#356ae6" marker-end="url(#rb)"/><line x1="166" y1="37" x2="176" y2="37" stroke="#356ae6" marker-end="url(#rb)"/><line x1="250" y1="37" x2="260" y2="37" stroke="#356ae6" marker-end="url(#rb)"/><text x="6" y="72" fill="#7d8599">机器人:传感→SLAM/规划→控制→电机</text></svg><div class="cap">机器人:感知-决策-控制</div></div>
        </div>
        <div class="card" id="card-1-2" data-keywords="ROS 机器人操作系统:节点、话题(发布订阅)、服务、参数、TF 坐标变换;仿真 Gazebo;ROS2 实时性更好。 ">
          <div class="card-head">
            <span class="card-num">2</span>
            <span class="card-title">ROS</span>
          </div>
          <div class="card-code">机器人操作系统:节点、话题(发布订阅)、服务、参数、TF 坐标变换;仿真 Gazebo;ROS2 实时性更好。</div>
        </div>
      </div>
    </div>
    <div class="section" id="sect-2">
      <button class="section-head">
        <span class="icon">2</span>
        <span class="title">二、运动与控制</span>
        <span class="count">2 条</span>
        <span class="arrow">▼</span>
      </button>
      <div class="section-body">
        <div class="card" id="card-2-3" data-keywords="运动学 正/逆运动学、坐标变换;差速/全向/机械臂;轨迹规划与插补。 ">
          <div class="card-head">
            <span class="card-num">3</span>
            <span class="card-title">运动学</span>
          </div>
          <div class="card-code">正/逆运动学、坐标变换;差速/全向/机械臂;轨迹规划与插补。</div>
        </div>
        <div class="card" id="card-2-4" data-keywords="控制与融合 PID/力控;多传感器融合(卡尔曼滤波);避障与导航(move_base/Nav2)。 ">
          <div class="card-head">
            <span class="card-num">4</span>
            <span class="card-title">控制与融合</span>
          </div>
          <div class="card-code">PID/力控;多传感器融合(卡尔曼滤波);避障与导航(move_base/Nav2)。</div>
        </div>
      </div>
    </div>
</div>
<button class="back-top" id="backTop" title="回到顶部">↑</button>
<div class="no-result" id="noResult" style="display:none">没有找到匹配的知识点</div>
<script>
(function() {
  var container = document.getElementById('cardContainer');
  var sections = container.querySelectorAll('.section');
  var totalCards = container.querySelectorAll('.card').length;
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var resultCount = document.getElementById('resultCount');
  var backTop = document.getElementById('backTop');
  var firstSection = sections[0];

  resultCount.textContent = totalCards + ' 条';

  container.addEventListener('click', function(e) {
    var head = e.target.closest('.section-head');
    if (!head) return;
    var section = head.closest('.section');
    if (!section) return;
    if (searchInput.value.trim()) return;
    section.classList.toggle('open');
  });

  function doSearch() {
    var q = searchInput.value.trim().toLowerCase();
    var visible = 0;
    if (q) { searchClear.classList.add('visible'); } else { searchClear.classList.remove('visible'); }
    var sections = container.querySelectorAll('.section');
    sections.forEach(function(section) {
      var cards = section.querySelectorAll('.card');
      var sectionVisible = 0;
      cards.forEach(function(card) {
        var title = card.querySelector('.card-title');
        var code = card.querySelector('.card-code');
        var keywords = card.getAttribute('data-keywords') || '';
        var text = (title ? title.textContent : '') + ' ' + (code ? code.textContent : '') + ' ' + keywords;
        text = text.toLowerCase();
        if (!q || text.indexOf(q) >= 0) {
          card.classList.remove('hidden');
          sectionVisible++;
          if (q) { highlightText(card, q); } else { removeHighlights(card); }
        } else {
          card.classList.add('hidden');
          removeHighlights(card);
        }
      });
      if (q && sectionVisible === 0) { section.classList.remove('open'); }
      else if (q) { section.classList.add('open'); }
      else { if (section === firstSection) section.classList.add('open'); else section.classList.remove('open'); }
      visible += sectionVisible;
    });
    resultCount.textContent = q ? (visible + ' / ' + totalCards + ' 条') : (totalCards + ' 条');
    document.getElementById('noResult').style.display = (q && visible === 0) ? 'block' : 'none';
  }

  function highlightText(el, q) {
    removeHighlights(el);
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node) {
      var parent = node.parentNode;
      if (parent.tagName === 'MARK') return;
      var text = node.textContent;
      var lower = text.toLowerCase();
      var idx = lower.indexOf(q);
      if (idx < 0) return;
      var frag = document.createDocumentFragment();
      var last = 0;
      while (idx >= 0) {
        if (idx > last) frag.appendChild(document.createTextNode(text.substring(last, idx)));
        var mark = document.createElement('mark');
        mark.textContent = text.substring(idx, idx + q.length);
        frag.appendChild(mark);
        last = idx + q.length;
        var rest = lower.substring(last);
        idx = rest.indexOf(q);
        if (idx >= 0) idx += last;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
      parent.replaceChild(frag, node);
    });
  }

  function removeHighlights(el) {
    var marks = el.querySelectorAll('mark');
    marks.forEach(function(m) { m.replaceWith(document.createTextNode(m.textContent)); });
  }

  searchInput.addEventListener('input', function() {
    clearTimeout(searchInput._timer);
    searchInput._timer = setTimeout(doSearch, 150);
  });
  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    doSearch();
    searchInput.focus();
  });

  window.addEventListener('scroll', function() {
    if (window.scrollY > 400) backTop.classList.add('visible');
    else backTop.classList.remove('visible');
  });
  backTop.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      searchInput.focus();
    }
  });
})();
</script>
</body></html>
